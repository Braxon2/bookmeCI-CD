spring.application.name=bookme

# PostgreSQL Connection Properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookme}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgresql}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG

jwt.secret-key=${JWT_SECRET_KEY}

# --- FLYWAY CONFIGURATION ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1.1

#AWS
aws.s3.region=${AWS_S3_REGION:eu-north-1}
aws.s3.bucketName=${AWS_S3_BUCKET_NAME:bookme-app-storage}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#bucket4j
ratingLimit.tokenInBucket=10
ratingLimit.duration=1

aws.s3.presigned-url-duration-minutes=${AWS_S3_PRESIGNED_URL_DURATION_MINUTES:30}
app.storage-prefix=${APP_STORAGE_PREFIX:dev}

# AI provider and model (disabled unless explicitly enabled)
spring.ai.model.chat=${AI_CHAT_PROVIDER:none}
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.chat.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:512}
spring.ai.google.genai.chat.temperature=0.2
spring.ai.google.genai.chat.thinking-level=LOW
spring.ai.google.genai.chat.include-thoughts=true
spring.ai.retry.max-attempts=1

# Smart filter provider request timeout
bookme.ai.timeout-ms=${AI_TIMEOUT_MS:20000}

# Provider logs can contain response bodies; use the safe com.dusanbranovic.bookme.ai logs.
logging.level.org.springframework.ai=OFF
logging.level.com.google.genai=OFF
