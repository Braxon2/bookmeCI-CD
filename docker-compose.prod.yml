services:
  db:
    image: postgres:18-alpine
    container_name: bookme-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - bookme-network

  backend:
    image: braxon2/bookme-backend:latest
    container_name: bookmeci-cd-backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      aws.s3.bucketName: ${AWS_S3_BUCKET_NAME}
      aws.s3.region: ${AWS_S3_REGION}
      aws.accessKeyId: ${AWS_ACCESS_KEY_ID}
      aws.secretKey: ${AWS_SECRET_ACCESS_KEY}
      ratingLimit.tokenInBucket: ${RATINGLIMIT_TOKENINBUCKET}
      ratingLimit.duration: ${RATINGLIMIT_DURATION}
    networks:
      - bookme-network

  frontend:
    image: braxon2/bookme-frontend:latest
    container_name: bookme-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - bookme-network

  deploy-to-ec2:
    needs: docker-publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Copy Compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/bookme"

      - name: Execute Deployment Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/bookme
            sudo docker compose -f docker-compose.prod.yml pull
            sudo docker compose -f docker-compose.prod.yml up -d

volumes:
  postgres_data:

networks:
  bookme-network:
    driver: bridge
