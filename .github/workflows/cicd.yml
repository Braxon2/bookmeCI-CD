name: Bookme CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Serialize workflows for each branch; do not interrupt a running deployment.
concurrency:
  group: bookme-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  configuration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose and deployment script
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          JWT_SECRET_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config --quiet
          docker compose --env-file .env.example -f docker-compose.prod.yml config --quiet
          bash -n scripts/deploy.sh
          bash scripts/test-deploy.sh

  backend-build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bookme-test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgresql
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bookme-test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/bookme/pom.xml
      - name: Build and test backend (including PostgreSQL integration tests)
        working-directory: ./backend/bookme
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/bookme-test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgresql
          AI_CHAT_PROVIDER: none
          AWS_ACCESS_KEY_ID: ci-dummy-key
          AWS_SECRET_ACCESS_KEY: ci-dummy-secret
          AWS_EC2_METADATA_DISABLED: "true"
        run: mvn -B clean verify

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json
      - name: Install, test and build
        working-directory: ./frontend
        env:
          VITE_API_URL: ""
        run: |
          npm ci
          node --test src/utils/unitSearchFilters.test.js
          npm run build

  docker-publish:
    needs: [configuration-check, backend-build-test, frontend-build]
    runs-on: ubuntu-latest
    env:
      IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME || 'braxon2' }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build backend image (publish only on main push)
        uses: docker/build-push-action@v7
        with:
          context: ./backend/bookme
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/bookme-backend:latest
            ${{ env.IMAGE_NAMESPACE }}/bookme-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image (publish only on main push)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          build-args: VITE_API_URL=
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/bookme-frontend:latest
            ${{ env.IMAGE_NAMESPACE }}/bookme-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-to-ec2:
    needs: docker-publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Copy Compose file and deployment script to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml,scripts/deploy.sh
          target: /home/ubuntu/bookme/
      - name: Deploy exact images, check health and roll back on failure
        uses: appleboy/ssh-action@v1.0.3
        env:
          CURRENT_SHA: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: CURRENT_SHA,DOCKERHUB_USERNAME
          command_timeout: 15m
          script: |
            set -e
            cd /home/ubuntu/bookme
            bash scripts/deploy.sh
