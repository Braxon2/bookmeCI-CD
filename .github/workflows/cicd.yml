name: Bookme CI/CD


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bookme
          POSTGRES_USER: ${{ secrets.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build and Test Backend
        working-directory: ./backend/bookme

        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/bookme
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_REGION: ${{ secrets.AWS_S3_REGION }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
        run: mvn clean install -DskipTests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install and Build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  docker-publish:
    needs: [backend-build-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/bookme
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bookme-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bookme-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bookme-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bookme-frontend:${{ github.sha }}

  deploy-to-ec2:
    needs: docker-publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Copy Compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/ubuntu/bookme/"

      - name: Deploy, Health Check, and Auto-Rollback
        uses: appleboy/ssh-action@v1.0.3
        env:
          CURRENT_SHA: ${{ github.sha }}
          PREVIOUS_SHA: ${{ github.event.before }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: CURRENT_SHA,PREVIOUS_SHA
          script: |
            cd /home/ubuntu/bookme
            
            echo "Deploying version: $CURRENT_SHA"
            sudo env APP_VERSION=$CURRENT_SHA docker compose -f docker-compose.prod.yml pull
            sudo env APP_VERSION=$CURRENT_SHA docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            echo "Waiting 15 seconds for Spring Boot startup..."
            sleep 15
            
            HEALTH_OK=false
            for i in $(seq 1 10); do
              if curl -sf http://localhost:8080/api/health > /dev/null; then
                HEALTH_OK=true
                echo "Health check passed! Deployment successful."
                break
              fi
              echo "Attempt $i failed, retrying in 5 seconds..."
              sleep 5
            done
            
            if [ "$HEALTH_OK" = false ]; then
              echo "Health check failed! Initiating automated rollback to $PREVIOUS_SHA..."
              sudo env APP_VERSION=$PREVIOUS_SHA docker compose -f docker-compose.prod.yml pull
              sudo env APP_VERSION=$PREVIOUS_SHA docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
              echo "Rollback complete. Marking build as failed."
              exit 1 
            fi